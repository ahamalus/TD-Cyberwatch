# TrustData CyberWatch — reproducible deployment.
# Only the "web" service publishes a port, and only on localhost by default:
# put an HTTPS reverse proxy (deploy/nginx or Caddy) in front of it.
# PostgreSQL and Redis are never published.

x-backend: &backend
  build: ./backend
  image: trustdata/cyberwatch-backend:${CW_VERSION:-local}
  env_file: .env
  environment:
    CW_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CW_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped
  networks: [internal]
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [internal]

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]

  api:
    <<: *backend
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: ["storage:/var/lib/cyberwatch/storage"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      retries: 3

  # Monitoring worker: file scans, connection tests, availability and TLS checks.
  # Runs on the "egress" network so it can reach customer hosting; the API does not.
  worker-monitoring:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "monitoring,checks", "-n", "monitoring@%h", "--concurrency", "${CW_MONITORING_CONCURRENCY:-4}", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal, egress]

  worker-notifications:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "notifications,default", "-n", "notifications@%h", "--concurrency", "2", "--loglevel", "INFO"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes: ["storage:/var/lib/cyberwatch/storage"]
    networks: [internal, egress]

  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel", "INFO", "-s", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    build: ./frontend
    image: trustdata/cyberwatch-web:${CW_VERSION:-local}
    depends_on: [api]
    ports: ["${CW_WEB_BIND:-127.0.0.1}:${CW_WEB_PORT:-8080}:8080"]
    restart: unless-stopped
    networks: [internal, public]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:
    internal: true
  egress: {}
  public: {}

volumes:
  pgdata: {}
  redisdata: {}
  storage: {}
