# Edge reverse proxy (host nginx) terminating TLS in front of the "web" container.
# Obtain certificates with certbot: certbot --nginx -d cyberwatch.example.com
server {
    listen 80;
    server_name cyberwatch.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cyberwatch.example.com;

    ssl_certificate     /etc/letsencrypt/live/cyberwatch.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberwatch.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    server_tokens off;
    client_max_body_size 2m;

    # Basic edge rate limiting for authentication endpoints (the API also rate-limits).
    location /api/v1/auth/ {
        limit_req zone=cw_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/cyberwatch-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/cyberwatch-proxy.conf;
    }
}

# In the http {} block of nginx.conf:
#   limit_req_zone $binary_remote_addr zone=cw_auth:10m rate=10r/m;
#
# /etc/nginx/snippets/cyberwatch-proxy.conf:
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 120s;
