[project]
name = "cyberwatch-backend"
version = "0.1.0"
description = "TrustData CyberWatch API and monitoring workers"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "BLE", "SIM"]
ignore = ["E501", "B008", "S101", "S311", "B904", "SIM102", "SIM103", "SIM105", "SIM110", "SIM117", "UP017", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE", "B017", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
